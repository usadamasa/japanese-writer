# This workflow is managed by gh actions-lock.
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: ci

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage.out

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: aquaproj/aqua-installer@v3.1.2
        with:
          aqua_version: v2.63.0

      # shellcheck は shellcheck job が担うので､ここは Go の lint だけを走らせる
      - name: Run golangci-lint
        run: task lint:go

  plugin-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: aquaproj/aqua-installer@v3.1.2
        with:
          aqua_version: v2.63.0

      # 版を固定せず最新を入れる｡この job の目的は「今の Claude Code ランタイムが plugin を受理するか」を
      # 確かめること｡利用者側の Claude Code は自動更新されるので､固定版で通っても利用者の環境で
      # 受理される保証にならない｡
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Validate plugin manifests, skills and agents
        run: task validate:plugin

  json-schema:
    name: JSON schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: aquaproj/aqua-installer@v3.1.2
        with:
          aqua_version: v2.63.0

      - name: Validate JSON / YAML against declared schemas
        run: task validate:schema

  bats-test:
    name: bats test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: aquaproj/aqua-installer@v3.1.2
        with:
          aqua_version: v2.63.0

      - name: Install bats-core
        run: |
          sudo apt-get update -q
          sudo apt-get install -y bats

      - name: Run bats tests
        run: bats tests/

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      # apt の shellcheck ではなく aqua で固定した版を使い､ローカルの task lint と結果を揃える
      - uses: aquaproj/aqua-installer@v3.1.2
        with:
          aqua_version: v2.63.0

      - name: Run shellcheck
        run: task lint:shell

  actions-lock:
    name: actions-lock verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.1.6

      - name: Verify actions are locked
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify

  ci-status-check:
    needs:
      - go-test
      - lint
      - plugin-validate
      - json-schema
      - bats-test
      - shellcheck
      - actions-lock
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: exit 1
