# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: ci

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage
          path: coverage.out

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: aquaproj/aqua-installer@5e54e5cee8a95ee2ce7c04cb993da6dfad13e59c  # v3.1.2
        with:
          aqua_version: v2.63.0

      # shellcheck は shellcheck job が担うので､ここは Go の lint だけを走らせる
      - name: Run golangci-lint
        run: task lint:go

  plugin-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: aquaproj/aqua-installer@5e54e5cee8a95ee2ce7c04cb993da6dfad13e59c  # v3.1.2
        with:
          aqua_version: v2.63.0

      # 版を固定せず最新を入れる｡この job の目的は「今の Claude Code ランタイムが plugin を受理するか」を
      # 確かめること｡利用者側の Claude Code は自動更新されるので､固定版で通っても利用者の環境で
      # 受理される保証にならない｡
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Validate plugin manifests, skills and agents
        run: task validate:plugin

  json-schema:
    name: JSON schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: aquaproj/aqua-installer@5e54e5cee8a95ee2ce7c04cb993da6dfad13e59c  # v3.1.2
        with:
          aqua_version: v2.63.0

      - name: Validate JSON / YAML against declared schemas
        run: task validate:schema

  bats-test:
    name: bats test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: aquaproj/aqua-installer@5e54e5cee8a95ee2ce7c04cb993da6dfad13e59c  # v3.1.2
        with:
          aqua_version: v2.63.0

      - name: Install bats-core
        run: |
          sudo apt-get update -q
          sudo apt-get install -y bats

      - name: Run bats tests
        run: bats tests/

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      # apt の shellcheck ではなく aqua で固定した版を使い､ローカルの task lint と結果を揃える
      - uses: aquaproj/aqua-installer@5e54e5cee8a95ee2ce7c04cb993da6dfad13e59c  # v3.1.2
        with:
          aqua_version: v2.63.0

      - name: Run shellcheck
        run: task lint:shell

  pinact:
    name: pinact verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: aquaproj/aqua-installer@5e54e5cee8a95ee2ce7c04cb993da6dfad13e59c  # v3.1.2
        with:
          aqua_version: v2.63.0

      # --check が無いと､pinact は未ピンの action をその場で書き換えて exit 0 で終わり､job が素通りする
      - name: Verify actions are pinned
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pinact run --verify --check

  # Claude Code は manifest の version が変わったときだけ update を配る｡上げ忘れを merge 前に止める
  version-bump:
    name: version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - name: Check that plugin.json version is bumped
        env:
          BASE_REF: ${{ github.base_ref }}
        run: ./scripts/check-version-bump.sh "origin/$BASE_REF"

  ci-status-check:
    needs: [go-test, lint, plugin-validate, json-schema, bats-test, shellcheck, pinact, version-bump]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: exit 1
