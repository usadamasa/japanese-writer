# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: ci

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Go と lint・テストのツールは flake.nix の devShell から取る (setup-nix)。版の正本は flake.lock
jobs:
  go-test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: $/.github/actions/setup-nix

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage.out

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: $/.github/actions/setup-nix

      # shellcheck は shellcheck job が担うので､ここは Go の lint だけを走らせる
      - name: Run golangci-lint
        run: task lint:go

  plugin-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: $/.github/actions/setup-nix

      # 版を固定せず最新を入れる｡この job の目的は「今の Claude Code ランタイムが plugin を受理するか」を
      # 確かめること｡利用者側の Claude Code は自動更新されるので､固定版で通っても利用者の環境で
      # 受理される保証にならない｡npm はランナーのものを使う (devShell には node を入れていない)
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Validate plugin manifests, skills and agents
        run: task validate:plugin

  json-schema:
    name: JSON schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: $/.github/actions/setup-nix

      - name: Validate JSON / YAML against declared schemas
        run: task validate:schema

  bats-test:
    name: bats test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: $/.github/actions/setup-nix

      - name: Run bats tests
        run: bats tests/

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # apt の shellcheck ではなく devShell で固定した版を使い､ローカルの task lint と結果を揃える
      - uses: $/.github/actions/setup-nix

      - name: Run shellcheck
        run: task lint:shell

  actions-lock:
    name: actions-lock verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.2.0

      - name: Verify actions are locked
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify

  ci-status-check:
    runs-on: ubuntu-slim
    if: always()
    timeout-minutes: 10
    needs:
      - go-test
      - lint
      - plugin-validate
      - json-schema
      - bats-test
      - shellcheck
      - actions-lock
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
