# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# https://github.com/Songmu/tagpr
name: tagpr

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tagpr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      # GitHub App usadamasa-tagpr のトークンで動かす｡GITHUB_TOKEN だと release PR を作れず､
      # 作った PR やタグが他の workflow を起動しない｡Client ID は公開情報なので直接書く
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          client-id: Iv23liqxSJK4kOrLJFj4
          private-key: ${{ secrets.TAGPR_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read

      - uses: Songmu/tagpr@7ebae2dcc300132baa7cc9dd108c8923b07fc366  # v1.20.3
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
