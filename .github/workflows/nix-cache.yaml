# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# setup-nix は default branch の run でだけ nix store を保存するので、ここで main の cache を作る。
# 書き方の理由は usadamasa/gh-manage の actions/setup-nix/README.md
name: Nix cache

"on":
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: usadamasa/gh-manage/actions/setup-nix@main
