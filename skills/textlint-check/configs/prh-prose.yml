version: 1

# 語・句レベルの NG 表現の prh ルール｡検出だけを行い、autofix はしない｡
#
# prh は expected を必須とするため、ここでも置換候補を書く｡ただしその語は
# 「書き換えの方向」を示すためのもので、そのまま差し替えることは求めていない｡
# 検出語だけを別の語へ置き換えると、同じ問題が形を変えて残る｡
# 検出語を含む文をまるごと書き直す｡
#
# autofix を通さない仕掛けは config 側にある｡fix pass (fix.textlintrc.json) は
# prh-notation.yml しか読まないため、このファイルのルールは lint pass にしか現れない｡
#
# ルールの追加は writing-feedback skill が行う｡NG パターンと良い書き換え例を
# 対で登録する｡禁止だけを並べると、回りくどい言い換えを生む｡
#
# 各ルールのコメントには「何が問題か」「何を拾い、何を拾わないか」だけを書く｡
# 出所や計測値は書かない｡ルールの是非はそれだけで判断できる｡

rules:

  # ====================================================================
  # Phase 2.4: 視点と語り — 「あなた」 を役割名に置き換える
  # ====================================================================
  # 英語の "address reader as 'you'" は日本語に合わないため、 japanese-tech-writing Phase 2.4 で却下｡
  # 適切な役割名は文脈で変わる (読者・開発者・設計者・運用者)｡

  - expected: 読者
    pattern: あなた
    prh: 'japanese-tech-writing Phase 2.4: 読者は役割名 (読者・開発者・設計者等) で呼ぶ｡ 「あなた」を語だけ差し替えず、主語の立て方から書き直す｡'

  # ====================================================================
  # Phase 2.9: 略号・英文略号 — 日本語に和訳
  # ====================================================================
  # 専門略語 (URL、 HTTP、 JSON、 ADR、 PR) は対象外｡ Latin 略号のみ｡
  # 語を差し替えるだけでは読点や語順が合わないため、文単位で直す｡

  - expected: 例えば
    pattern: /\be\.g\.\s?/
    prh: 'japanese-tech-writing Phase 2.9: 英文略号 e.g. は和訳する｡例示の位置も含めて文を組み直す｡'

  - expected: すなわち
    pattern: /\bi\.e\.\s?/
    prh: 'japanese-tech-writing Phase 2.9: 英文略号 i.e. は和訳する｡ 「つまり」 でも可｡'

  - expected: など
    pattern: /\betc\.(?!js|json|html|css|cjs|mjs|md|sh|py|ts|tsx|go|rs|toml|yaml|yml)/
    prh: 'japanese-tech-writing Phase 2.9: 英文略号 etc. は和訳する｡ 「等」 でも可｡ (ファイル拡張子 .etcXXX は除外)'

  - expected: '注: '
    pattern: /\bN\.B\.\s?/
    prh: 'japanese-tech-writing Phase 2.9: 英文略号 N.B. は和訳する｡'

  - expected: '参照: '
    pattern: /\bcf\.\s?/
    prh: 'japanese-tech-writing Phase 2.9: 英文略号 cf. は和訳する｡'

  # vs. は「対」「との比較」 に｡ ただし ad-hoc な比較表記でよく使われるので、 文中の vs. のみ検出
  # (例: 「TypeScript vs Rust」 のような単独語句は文体次第なので Tier 2 扱い)
  - expected: '対'
    pattern: /\bvs\.\s?/
    prh: 'japanese-tech-writing Phase 2.9: 英文略号 vs. は「対」「との比較」 に｡'

  # ====================================================================
  # Phase 2.10: リンクテキスト — 内容のないリンクテキストを検出
  # ====================================================================
  # markdown のリンク記法 [...]( ) 内のテキストが「こちら」「click here」 等であれば検出｡
  # 行き先を示す句は本文から決まるため、置換候補は方向の指示にとどまる｡

  - expected: 行き先を示すテキスト
    pattern: /\[こちら\]\(/
    prh: 'japanese-tech-writing Phase 2.10: リンクテキスト「こちら」 は行き先を示す句に置き換える｡'

  - expected: 行き先を示すテキスト
    pattern: /\[click here\]\(/
    prh: 'japanese-tech-writing Phase 2.10: リンクテキスト「click here」 は行き先を示す句に置き換える｡'

  - expected: 行き先を示すテキスト
    pattern: /\[詳細\]\(/
    prh: 'japanese-tech-writing Phase 2.10: リンクテキスト「詳細」 は行き先を示す句に置き換える｡'

  # ====================================================================
  # 判断の丸投げ — 「迷ったら X」 を選ぶ条件の列挙に書き換える
  # ====================================================================
  # 指示文で「迷ったら X を選ぶ」 と書くと、いつ迷うかの判断を読み手に投げることになる｡
  # X を選ぶ条件と選ばない条件を列挙し、迷う余地を無くす｡
  # 「迷ったとき (に使う)」 のような起動条件の記述は対象外なので、 「迷ったら」 だけを拾う｡

  - expected: 選ぶ条件の列挙
    pattern: /迷ったら/
    prh: '「迷ったら X」 は判断を読み手に投げている｡ X を選ぶ条件と選ばない条件を列挙して、迷う余地を無くす｡語を差し替えず文ごと直す｡'

  # ====================================================================
  # 失敗の擬人化 — 「無言で」「静かに」 を観測できる事実に書き換える
  # ====================================================================
  # 通知の無い失敗を 「無言で落ちる」 「静かに失敗する」 と書くと、何が起きたのかが残らない｡
  # 読み手が知りたいのは、どの経路で何が観測できなかったか｡次のどれなのかを書く｡
  #   - 成功として報告される (job は緑のまま)
  #   - エラーが記録されるが通知されない
  #   - 処理がスキップされ、記録も残らない
  # 後ろに来る動詞は失敗系に限らない (除外される、スキップされる、間違う、外れる)｡
  # 「通知が無い」 という一点だけを共有しているので、 「静かに」 全体を拾う｡
  # 引用の中の 「静かなる死」 のような他人の表現は対象外なので、 「静かなる」 は拾わない｡

  - expected: 観測できた事実
    pattern: /無言[でにの]/
    prh: '失敗を 「無言で」 と書くと、何が観測できなかったのかが残らない｡成功として報告されるのか、記録はあるが通知されないのか、記録も残らないのかを書く｡語を差し替えず文ごと直す｡'

  - expected: 観測できた事実
    pattern: /静かに/
    prh: '「静かに」 は通知が無いことの比喩で、何が観測できなかったのかを残さない｡成功として報告されるのか、記録はあるが通知されないのか、記録も残らないのかを書く｡語を差し替えず文ごと直す｡'

  - expected: 観測できた事実
    pattern: /静かな(?!る)/
    prh: '「静かな失敗」 は通知が無いことの比喩で、何が観測できなかったのかを残さない｡どの経路で何が観測できなかったのかを書く｡語を差し替えず文ごと直す｡'

  # ====================================================================
  # 件数の先出し — 数えた対象が増減すると本文だけが古くなる
  # ====================================================================
  # 「次の 3 つ」 「7 つのうち」 のように件数を書くと、数えた対象が増えたときに
  # 本文だけが取り残される｡一覧が同じ文書の直後にあっても、別の場所
  # (Taskfile, go.mod, コマンドの出力) にあっても同じで、後者のほうが気づきにくい｡
  # 件数そのものは読み手に情報を足していない｡一覧を読めば分かる｡
  #
  # 「3 つ目の引数」 のような順序の指示は数えた一覧を持たないので拾わない｡
  # 拾うのは一覧を指す語 (次 / 以下 / 上記 / この) と 「N (つ/個/件/種類/リポジトリ/ファイル) のうち」 に限る｡
  # 「10 年のうち」 「2 回のうち」 のような時間・回数の表現は一覧を数えたものではないので、
  # 単位を明示列挙する形のまま広げすぎない｡

  - expected: 件数を書かずに一覧へ任せる
    pattern: /(次の|以下の|上記の|この) *[0-9０-９]+ *(つ|個|件|種類)/
    prh: '件数を先に書くと、数えた対象が増減したときに本文だけが古くなる｡「次の 3 つ」 ではなく 「次の」 とだけ書いて、数は一覧に任せる｡語を差し替えず文ごと直す｡'

  - expected: 件数を書かずに条件だけを書く
    pattern: /[0-9０-９]+ *(つ|個|件|種類|リポジトリ|ファイル)のうち/
    prh: '数えた一覧が別のファイル (Taskfile, go.mod, コマンドの出力) にあると、増減しても本文は追従しない｡件数を落として条件だけを書き、一覧はその正本を指す｡語を差し替えず文ごと直す｡'

  # ====================================================================
  # 建築の比喩 — 「床」「天井」 で要件や上限を語らない
  # ====================================================================
  # 「床」 は 「一律に課される最低要件」、 「天井」 は 「これ以上は上げられない上限」 の言い換えとして
  # 出てくるが、どちらも誰が何に対して課すのかを書かずに済ませてしまう｡
  # 助詞と述語まで含めて拾うのは、 床面積・起床・臨床・天井高 のような通常の語を除くため｡
  # 「天井である」 のように述語の形で出るものも拾う｡助詞だけを見ていると述語の形を取り逃す｡

  - expected: 課される要件そのもの
    pattern: /床(を張|が張|として|だけ|の上)/
    prh: '規約や権限の最低要件を 「床」 と書くと、誰が何に対して何を課すのかが残らない｡課す主体と対象と内容を書く (例: 「組織のルールが全リポジトリへ一律に課す最低要件」)｡語を差し替えず文ごと直す｡'

  - expected: 上限そのもの
    pattern: /天井(を|が|に達|まで|である|だ)/
    prh: '到達できる限界を 「天井」 と書くと、何によって決まる限界なのかが残らない｡限界を決めている条件と、その値を書く｡「制約」 に替えるだけでは条件が残らない｡語を差し替えず文ごと直す｡'

  # ====================================================================
  # 直訳語 — 「木」「作業木」「描画」 で指しているものをぼかさない
  # ====================================================================
  # ディレクトリ階層や作業コピーを 「木」 と呼ぶと、指しているものが読み手に渡らない｡
  # tree の直訳で、日本語の技術文書では一般的ではない｡clone なのか checkout 先なのか
  # 特定のディレクトリなのかで、読み手が動かす対象が変わる｡
  # 直前が漢字のときは拾わない｡構文木・二分木・探索木のような確立した用語を除くため｡

  - expected: 指しているもの (repository の clone、checkout 先、ディレクトリ)
    pattern: /(?<![一-龠])木(を|が|は|に|で|へ|では|でな)/
    prh: 'ディレクトリや作業コピーを 「木」 と呼ぶと、指しているものが残らない｡repository の clone、checkout 先、対象のディレクトリのどれなのかを書く｡語を差し替えず文ごと直す｡'

  # 「作業木」 は working tree の直訳｡直前が漢字のため上のルールの lookbehind で
  # 落ちるので、複合語として別に拾う｡構文木・二分木と違って確立した用語ではない｡

  - expected: 作業ディレクトリ
    pattern: /作業木/
    prh: 'working tree を 「作業木」 と直訳すると、指しているものが残らない｡作業ディレクトリ、clone、checkout 先のどれなのかを書く｡語を差し替えず文ごと直す｡'

  # placeholder の置換やファイル生成を 「描画」 と呼ぶと、何が起きるのかが渡らない｡
  # render の直訳で、日本語では画像や画面を描く意味に取られる｡実際にやっているのは
  # 値の埋め込み、ファイルの生成、不要なファイルの削除で、そのどれなのかで
  # 読み手が確かめる場所が変わる｡
  # 画像や画面を実際に描く意味の 「描画」 (図の PNG 化、画面の描画) は正しい用法なので
  # 無条件には拾わず、template / repository / placeholder / scaffold と同じ文にあるものだけを
  # 拾う｡keyword と 「描画」 の間に path が挟まるため、間隔は 24 文字まで見る｡
  #
  # **すり抜ける形がある｡** keyword が code span の中にあると
  # (「`scaffold/` を描画して」)、prh が見る text node が分かれて同じ文として
  # 扱われない｡この 1 行だけが検査の網であるとは考えず、レビューでも見る｡

  - expected: 実際にやっていること (placeholder を埋める、ファイルを生成する)
    pattern: /描画[^。\n]{0,24}(template|テンプレート|repository|リポジトリ|placeholder|scaffold)|(template|テンプレート|repository|リポジトリ|placeholder|scaffold)[^。\n]{0,24}描画/
    prh: 'placeholder の置換やファイル生成を 「描画」 と呼ぶと、何が起きるのかが渡らない｡値を埋めるのか、ファイルを作るのか、消すのかを書く｡語を差し替えず文ごと直す｡'

  # ====================================================================
  # 物理・数学からの借用語 — 説明なしでは読み手に渡らない
  # ====================================================================
  # 「摂動」 は検証の文脈で 「意図的に一つ条件を変えて確かめる」 の言い換えとして出てくるが、
  # 借用元の用語を知らない読み手には文が読めない｡何を変えて何を確かめるかを直接書く｡

  - expected: 何を変えて確かめるか
    pattern: /摂動/
    prh: '「摂動」 は物理・数学からの借用語で、説明なしでは読み手に渡らない｡何を変えて (どの条件・入力) 何を確かめるかを直接書く｡語を差し替えず文ごと直す｡'

  # ====================================================================
  # 「関門」 を比喩に使わない
  # ====================================================================
  # 「関門」 は何を指すかが文脈ごとに違う比喩で、指す対象を書かずに済ませる語になる｡
  # 何を指しているかは書き手の文脈でしか決まらないため、置き換える語は示さない｡
  # 固有名詞 (関門海峡・関門橋・関門トンネル) は拾わない｡

  - expected: 指している対象そのもの
    pattern: /関門(?!海峡|橋|トンネル)/
    prh: '「関門」 は使わない｡比喩で済ませず、何を指しているか (どの処理・どの判断・どの段階か) をそのまま書く｡語を差し替えず文ごと直す｡'

  # ====================================================================
  # 遠称の指示語で名詞を指し直さない
  # ====================================================================
  # 「あれが」「あの数は」 と書くと、読み手が先行詞を復元できない｡書き手は直前の
  # 段落を覚えているが、読み手は節単位で拾い読みする｡
  #
  # 直し方は名詞を書くことで、近称 (これ・それ) への置き換えではない｡指示語を
  # 別の指示語に替えても先行詞は復元できないままである｡受け直す先が長いなら、
  # 文を割って主語を立て直す｡
  #
  # 拾うのは遠称だけに絞る｡近称は直前の 1 文を指す用法が普通に成り立つ｡
  # 「あのように」 のような副詞の用法は格助詞を伴わないため外れる｡

  - expected: 指す名詞そのもの
    pattern: /あれ[がをはにでとも]|あの[^ 。、｡､\n]{1,4}(は|が|を)/
    prh: '遠称の指示語で名詞を指し直すと、読み手が先行詞を復元できない｡指している名詞を書く｡近称 (これ・それ) への置き換えでは直らない｡語を差し替えず文ごと直す｡'

  # ====================================================================
  # silent を日本語の連用・連体で使わない
  # ====================================================================
  # 英単語を日本語の副詞・形容動詞として流用すると、何が起きないのかが読み手に
  # 渡らない｡ログに出ないのか、通知が飛ばないのか、検出手段がないのかが全部
  # silent に畳まれる｡
  #
  # 直し方は、起きないことを名指しすることで、カタカナ化ではない｡「サイレントに
  # 失われる」 は同じ問題を残す｡「記録を残さず失われる」 「通知なく失われる」
  # 「検出されないまま失われる」 のように、欠けている観測手段を書く｡
  #
  # 識別子は拾わない｡`--silent` `silent=true` `setSilent` のように直前が
  # ハイフンか英数字のものは除く｡英文の中の silent も連用・連体の助詞を
  # 伴わないため外れる｡

  - expected: 起きないことを名指しした日本語
    pattern: /(?<![-\w])([Ss]ilent|サイレント)[ 　]*[にな]/
    prh: 'silent を日本語の連用・連体で使わない｡ログに出ないのか、通知がないのか、検出できないのかを名指しする (例: 記録を残さず失われる)｡カタカナ化では直らない｡語を差し替えず文ごと直す｡'

  # ====================================================================
  # 分割の説明を片側だけの限定で書かない
  # ====================================================================
  # 2 つのルールに切り分けたうちの一方について 「X だけを対象にする理由」 と見出しを
  # 立てると、読み手はその見出しから対象外の側の不在を読む (他方は検査しない、と
  # 誤読する)｡書き手は分割したことを知っているが、読み手は知らない｡
  #
  # 直し方は両側を名指しすることで、限定を外すことではない｡「A と B を分けている理由」
  # のように、切り分けたこと自体を主題にする｡対象の限定は冒頭の定義や表で示す｡
  #
  # 限定そのものが主題の場合 (対になる相手が存在しない場合) は正当なので、拾っても
  # 残す判断になる｡

  - expected: 分割した両側を名指しした見出し
    pattern: /(だけ|のみ)を(対象|扱)[^。、｡､\n]{0,10}理由/
    prh: '分割した一方だけを限定して見出しを立てると、対象外の側が非対応だと読める｡「A と B を分けている理由」 のように切り分けを主題にする｡対になる相手が無い限定なら残してよい｡語を差し替えず文ごと直す｡'

  # ====================================================================
  # 未確定を 「仮」 と書かない
  # ====================================================================
  # 中身が未確定の成果物を 「(仮)」 「仮ページ」 と呼ばない｡「仮」 は暫時の代用物
  # (後で本物が別に来る) を含意するが、示したいのは同じ成果物の中身が未確定である
  # ことである｡
  #
  # 置換先が文脈によらず一意ではないため autofix の側には置かない｡注記なら
  # 「(TBD)」、本文で状態を述べるなら 「未確定」 「未定」 が当たる｡仮説・仮定・
  # 仮想のように語幹として使う 「仮」 は拾わない｡
  #
  # 拾うのは成果物の呼称に付く 「仮」 だけに絞る｡「(仮)」 単体を拾うと、名前や
  # 数値そのものが未定の仮置き (`foo-service (仮)`、`上限 (仮)5`) を巻き込む｡
  # そちらは後で別の本物が来るので 「仮」 が正しく、直す対象ではない｡

  - expected: TBD
    pattern: /仮(ページ|ドキュメント|ドラフト|文書)/
    prh: '中身が未確定であることを 「仮」 と呼ばない｡注記は 「(TBD)」、本文で状態を述べるなら 「未確定」 「未定」 を使う｡「仮」 は後で別の本物が来ることを含意するが、成果物そのものは本物である｡語を差し替えず文ごと直す｡'

  # ====================================================================
  # 参照の説明文に採番の範囲を列挙しない
  # ====================================================================
  # 参照リンクの説明を 「ID-04 から ID-12 を追加する背景」 のように書くと、採番が
  # 増えるたびに書いた時点の範囲が古くなる｡説明文が本体の更新に追随を要求する形になる｡
  #
  # 直し方は範囲を種別へ畳むことで、範囲を広げ直すことではない｡「検査項目を
  # 追加する背景」 のように、何を追加したのかを書く｡
  #
  # 個々の ID への参照は対象外 (どの決定を指すかが情報なので残す)｡拾うのは
  # prefix が 2 文字以上の ID を 2 つ並べた範囲表現に限る｡
  #
  # 「A から B への経路」 のように起点と終点を指す用法は範囲ではないので、
  # 直後の 「への」 「へと」 を除外する｡

  - expected: 採番の種別
    pattern: /[A-Z]{2,}-\d+[ 　]*(から|〜|～)[ 　]*[A-Z]{2,}-\d+(?!\d)(?![ 　]*へ)/
    prh: '参照の説明文に採番の範囲を列挙しない｡追加のたびに古くなる｡「検査項目を追加する」 のように種別へ畳む｡個々の ID への参照は残してよい｡語を差し替えず文ごと直す｡'

  # ====================================================================
  # 「正本」 を使わない
  # ====================================================================
  # 「正本を直したら」 「正本の中では」 のように 「正本」 を主語や目的語に置くと、
  # 写しとの関係を含意するだけで、何の写しでどちらを直すのかが語からは決まらない｡
  # 「README.md が正本」 のように対象を名前で挙げた述語形でも、参照先の性質
  # (在り場所か、従うべき規範か) が読み手に渡らない｡
  #
  # 直し方は指している関係を動詞で書くことで、「正本」 を別の名詞に差し替える
  # ことではない｡
  #   - 参照先が具体的な内容の在り場所を指す場合 → 「〜にある｡」
  #   - 参照先が従うべき規範・手順を指す場合 → 「〜に従う｡」
  #
  # 1 本目は引数の位置に来る形を拾い、直前が 「の」 「を」 のものは除く｡
  # 2 本目は 「が正本」 の述語形を拾い、直前の助詞を問わない｡

  - expected: 指している関係の名前
    pattern: /(?:^|[^のを])正本(?:を|と|の|は|から)/
    prh: '「正本」 を主語や目的語として単独で置かない｡写しとの関係を含意するだけで、何の写しでどちらを直すのかが決まらない｡指している関係を名前で書く (「コピー元」 「出典」 「定義元」 「上流」)、または何の正本かを同じ文に置く｡語を差し替えず文ごと直す｡'

  - expected: にある / に従う
    pattern: /が正本/
    prh: '「X が正本」 の述語形も 「正本」 は使わない｡対象を名前で挙げていても、参照先の性質 (在り場所か、従うべき規範か) が渡らない｡具体的な内容の在り場所を指すなら 「〜にある｡」、従うべき規範・手順を指すなら 「〜に従う｡」 と書く｡語を差し替えず文ごと直す｡'

  # ====================================================================
  # 役割は 「書き手」 「読み手」 と呼ばない
  # ====================================================================
  # データやファイルの受け渡しの両端を 「書き手」 「読み手」 と書かない｡書き手・読み手は
  # 文章の当事者を指す語で、文書の中では読者と取り違える｡「書き込み側」 「読み込み側」
  # と書く｡
  #
  # 文章の当事者を指す正しい用法もある (「読み手は古い形を知らない」) ため、
  # 直後に受け渡しの対象を取る形だけを拾う｡

  - expected: 書き込み側 / 読み込み側
    pattern: /(?:書き手|読み手)(?:と(?:読み手|書き手))?(?:が|は|の|を|へ|に)(?:参照|一覧|handoff|task value|file|同じ|別|それぞれ)/
    prh: '受け渡しの役割を 「書き手」 「読み手」 と呼ばない｡文章の当事者を指す語なので、文書の中では読者と紛れる｡「書き込み側」 「読み込み側」 と書く｡語を差し替えず文ごと直す｡'

  # ====================================================================
  # テストの代役を 「偽物」 と呼ばない
  # ====================================================================
  # テストへ差し込む実装を 「偽物」 と書かない｡偽物は真偽の話で、差し込んだものが何を
  # するか (記録するのか・決まった値を返すのか) を言っていない｡
  #
  # 置換先は役割で変わる (mock・stub・spy・インメモリ実装) ため検出のみ｡

  - expected: mock / stub / spy
    pattern: 偽物
    prh: 'テストへ差し込む実装を 「偽物」 と呼ばない｡何をするものかが伝わらない｡役割の名前で書く (「mock」 「stub」 「spy」 「インメモリ実装」)｡語を差し替えず文ごと直す｡'

  # ====================================================================
  # 曖昧な動詞 — 対応関係や状態を比喩でごまかさない
  # ====================================================================
  # 動詞 1 語が状態・対応関係・行為を肩代わりしていると、読み手には何が起きたのかが
  # 渡らない｡「落ちる」 「止めていた」 「答えが出た」 はどれも、具体的な主語・目的語・
  # 行為に展開すれば直る点で同型なので、ここに並べる｡

  # 「同じ場所に落ちる」 は分布の範囲に入るという意味でも読めるが、 「同じ場所」 が
  # 指すものを名指ししていない点は変わらないため、そのまま拾う｡

  - expected: 変更する場所 / 変更する
    pattern: /落ちる先|場所[へに]落ちる/
    prh: '「落ちる」 を 「変更が反映される先」 の意味で使うと、テストや CI が落ちる (失敗する) の意味と紛れる｡ 「落ちる先」 は 「変更する場所」、 「同じ場所に落ちる」 は 「同じ場所を変える」 のように具体的な動詞に置き換えて文ごと書き直す｡語を差し替えず文ごと直す｡'

  # 「処理を止める」 「受付を止める」 のような実際の停止操作は対象外｡拾うのは
  # 調査や検討の状態を述べる 「で止めていた」 だけ｡

  - expected: 保留になっていた / 保留のままである
    pattern: /で止めてい(た|る)/
    prh: '調査や検討が結論に至らず保留になっている状態を 「(調査) で止めていた」 と書くと、誰かが何のために止めたという使役の含意が生じる｡ 「保留になっていた」 のように状態として書く｡ 「処理を止める」 「受付を止める」 のような実際の停止操作は対象外｡語を差し替えず文ごと直す｡'

  - expected: 検証した / 実機で確かめた
    pattern: /答えが出(た|る)/
    prh: '検証結果を 「実測で答えが出た」 のように書くと、答えが自然に現れたように読める｡実際に行った行為 (検証した、実機で確かめた) を主語に立てて書き直す｡語を差し替えず文ごと直す｡'

  # ====================================================================
  # 到達 — 抽象名詞より平易な動詞で経路を書く
  # ====================================================================
  # 「到達を拒む」 のような抽象名詞 + 動詞の構成は 「到達可能性」 「到達点」 のような
  # 確立した複合語と字面が近く、平易な動詞に展開しないと読み手に伝わらない｡
  # 「届かない」 に替えても技術的な精度は落ちない｡

  - expected: <経路> から <宛先> へ届かない / 接続できない
    pattern: /到達を[^。、｡､\n]{0,4}(拒|許|防|遮)/
    prh: '「到達を拒む」 のような抽象名詞 + 動詞の構成は、到達可能性のような確立した複合語と紛れるうえ、読み手に平易に伝わらない｡ 「届かない」 のような平易な動詞に置き換え、経路も言葉で列挙する｡語を差し替えず文ごと直す｡'

  # ====================================================================
  # 「穴」 で知識の欠落と実際の欠陥を同じ語で書かない
  # ====================================================================
  # 確認できていないこと (知識の欠落) と、実際の脆弱性・欠陥を同じ 「穴」 で書くと、
  # 読み手はどちらを言っているか判別できない｡ 「抜け穴」 のような確立した複合語は
  # 対象外｡

  - expected: 確認できなかったこと (未確認) / 実際の欠陥 (脆弱性)
    pattern: /穴[がを](空|あ)い/
    prh: '知識の欠落 (確認できていないこと) と実際の欠陥 (脆弱性) を同じ 「穴」 で書くと、どちらを言っているか読み手が判別できない｡未確認なら 「資料で確認できないことが残っていた」、実際の欠陥なら脆弱性・欠陥と明示して書き分ける｡ 「抜け穴」 のような確立した複合語は対象外｡語を差し替えず文ごと直す｡'

  # ====================================================================
  # 合意していないことを 「片付ける」 で決定済みのように書かない
  # ====================================================================
  # 合意していない対応方針を 「X と同時に片付ける」 で言い切ると、決定済みと区別が
  # つかない｡分かっている事実 (実測結果等) とこれから決める事項を分けて書く｡

  - expected: 保留のままである (分かっている事実と、これから決める事項を分ける)
    pattern: /(?:と同時に|で)片付ける/
    prh: '合意していない対応方針を 「(と同時に) 片付ける」 で言い切ると、決定済みのように読める｡分かっている事実 (実測結果等) とこれから決める事項を分け、決めていないことは決めていないと書く｡語を差し替えず文ごと直す｡'
