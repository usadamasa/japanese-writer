version: 1

# 表記ゆれの prh ルール｡autofix する｡
#
# ここに置けるのは、置換先が文脈によらず一意に決まるものだけ｡
# 語を差し替えても文の骨格が変わらないものに限る｡
# 置換先が文脈で変わるもの、置き換えると文が不自然になるものは prh-prose.yml へ｡

rules:

  # ====================================================================
  # Phase 2.7: 数字・日付・記号の表記 — 全角アラビア数字を半角化
  # ====================================================================

  - expected: '0'
    pattern: '０'
  - expected: '1'
    pattern: '１'
  - expected: '2'
    pattern: '２'
  - expected: '3'
    pattern: '３'
  - expected: '4'
    pattern: '４'
  - expected: '5'
    pattern: '５'
  - expected: '6'
    pattern: '６'
  - expected: '7'
    pattern: '７'
  - expected: '8'
    pattern: '８'
  - expected: '9'
    pattern: '９'

  # 全角チルダ「～」(U+FF5E) を波ダッシュ「〜」(U+301C) に
  # 範囲記号としての「〜」自体は japanese-tech-writing Phase 2.7 で許可している｡
  # 揃えるのは字種だけで、「から」への置き換えはしない｡
  #
  # 文書でこの文字自体を名指しするときは code span (`～`) に入れる｡地の文に置くと
  # この autofix が書き換えて、禁止している文字を示せなくなる｡prh は code span と
  # fenced block を触らない｡
  - expected: '〜'
    pattern: '～'
    prh: 'japanese-tech-writing Phase 2.7: 波ダッシュは 〜 (U+301C) を使う｡全角チルダ ～ (U+FF5E) は使わない｡'

  # ====================================================================
  # 句読点は全角
  #
  # 半角の句点は textlint のルールが文の区切りとして扱わない。sentence-length は
  # 区切り文字を option で受けず、段落全体を 1 文として数える。
  # ====================================================================

  - expected: '。'
    pattern: '｡'
    prh: '句点は全角の 。 (U+3002) を使う。半角の ｡ (U+FF61) は使わない。'
  - expected: '、'
    pattern: '､'
    prh: '読点は全角の 、 (U+3001) を使う。半角の ､ (U+FF64) は使わない。'
